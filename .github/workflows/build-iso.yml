name: Build OmarOS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, then boot-test the live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie-slim
      options: --privileged
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Debian Live and QEMU build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            dosfstools \
            mtools \
            rsync \
            ca-certificates \
            curl \
            file \
            qemu-system-x86 \
            qemu-utils \
            python3 \
            coreutils \
            grep \
            tesseract-ocr \
            libarchive-tools

      - name: Validate project files
        run: bash scripts/validate-project.sh

      - name: Build ISO
        run: bash scripts/build-iso.sh

      - name: Inspect ISO boot configuration for diagnostics
        run: |
          iso="live-image-amd64.hybrid.iso"
          echo "Boot-related configuration files inside the ISO:"
          bsdtar -tf "$iso" | grep -Ei '(^|/)(isolinux|syslinux|grub).*\.cfg$|\.cfg$' | head -n 30 > /tmp/omaros-boot-config-paths.txt || true
          if [ ! -s /tmp/omaros-boot-config-paths.txt ]; then
            echo "No boot configuration files matched the diagnostic filter."
          else
            while IFS= read -r path; do
              echo "--- ISO file: $path ---"
              bsdtar -xOf "$iso" "$path" 2>/dev/null | sed -n '1,120p' || true
            done < /tmp/omaros-boot-config-paths.txt
          fi

      - name: Verify required packages in the live filesystem manifest
        run: |
          manifest="binary/live/filesystem.packages"
          test -s "$manifest"
          for package in zram-tools xfce4-session firmware-atheros libreoffice-writer python3 nodejs wine64; do
            if ! awk -v wanted="$package" '$1 == wanted { found=1 } END { exit !found }' "$manifest"; then
              echo "Required package missing from live filesystem manifest: $package" >&2
              exit 1
            fi
          done

      - name: QEMU diskless boot smoke test
        run: bash scripts/qemu-smoke.sh live-image-amd64.hybrid.iso

      - name: Upload QEMU diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: OmarOS-QEMU-diagnostics
          path: qemu-diagnostics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Upload tested live ISO
        uses: actions/upload-artifact@v7
        with:
          name: OmarOS-live-ISO
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
